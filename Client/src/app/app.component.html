<div class="main-content">
  <h1>MEAN stack application</h1>
  <h2>Courses List in table format</h2>
  <button class="btn btn-primary" (click)="readData()">READ Courses List</button>
 
  <div *ngIf="isDataVisible" class="read-data">
      <table>
        <tr>
          <td><strong>Name</strong></td>
          <td><strong>Fees</strong></td>
          <td><strong>Duration</strong></td>
        </tr>
        <tr *ngFor = "let coursedata of coursesdata" [attr.courseid]="'coursedata-' + coursedata._id">
          <td>{{coursedata.Name}}</td>
          <td>{{coursedata.Fees}}</td>
          <td>{{coursedata.Duration}}</td>
        </tr>
      </table>
  </div>
</div>

<div class="container">
  <div class="col-6 course-cls">
    <form [formGroup]="insertBatches" (ngSubmit)="onSubmitBatch()">
      <div class="form-group">
        <label for="Name">Course Name</label>
          <input id="Name" type="text" formControlName="Name" class="form-control"/>
          <small [class.d-none]="insertBatches.get('Name')?.valid" class="text-danger">Course Name is required</small>
      </div>
    
      <div class="form-group">
          <label for="Fees">Course Fees</label>
          <input id="Fees" type="text" formControlName="Fees" class="form-control"/>
          <small [class.d-none]="insertBatches.get('Fees')?.valid" class="text-danger">Course Fees is required</small>
      </div>
    
      <div class="form-group">
        <label for="Duration">Duration</label>
        <input id="Duration" type="text" formControlName="Duration" class="form-control"/>
        <small [class.d-none]="insertBatches.get('Duration')?.valid" class="text-danger">Course Duration is required</small>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
  
</div>


<router-outlet />
