
<div class="container signup-form">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="text-center">
                    <h1>Marvellous Restaurant Portal Sign Up</h1>
                    <h5>You can Sign Up here!</h5>
                </div>
                <form [formGroup]="signupForm" (ngSubmit)="signUp()">
                    <div class="mb-3">
                      <label class="form-label">Email address</label>
                      <input formControlName="email" type="email" class="form-control" id="exampleInputEmail1"  placeholder="Email address">
                      <div *ngIf="email?.invalid && email?.touched">
                        <small *ngIf="email?.errors?.['required']">Email is required.</small>
                      </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input formControlName="name"  type="text" class="form-control" id="exampleInputEmail1"  placeholder="Name">
                        <div *ngIf="name?.invalid && name?.touched">
                          <small *ngIf="name?.errors?.['required']">Name is required.</small>
                        </div>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input  formControlName="mobile"  type="number" class="form-control" id="exampleInputEmail1"  placeholder="Phone">
                      </div>
                    <div class="mb-3">
                      <label class="form-label">Password</label>
                      <input formControlName="password"  type="password" class="form-control" id="exampleInputPassword1">
                      <div *ngIf="password?.invalid && password?.touched">
                        <small *ngIf="password?.errors?.['required']">Password is required.</small>
                      </div>
                    </div>
                    <button type="submit" class="btn btn-primary" [disabled]="signupForm.invalid">sign up</button>
                  </form>
                  <a style="color: blue; margin-top: 10px;" routerLink="/login">Already User? Click to Login</a>

            </div>
        </div>
    </div>
</div>
